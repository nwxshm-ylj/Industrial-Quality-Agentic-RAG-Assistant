
services:
  redis:
    image: redis:7.4.2-alpine
    container_name: industrial-rag-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  neo4j:
    image: neo4j:5.26.28-community
    container_name: industrial-rag-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-rag_graph_password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: industrial-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    container_name: industrial-rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-industrial_rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: industrial-rag-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  deepdoc-runtime:
    profiles: ["deepdoc"]
    image: industrial-rag-deepdoc-runtime:1.0.0
    build:
      context: .
      dockerfile: deepdoc_runtime/Dockerfile
    container_name: industrial-rag-deepdoc-runtime
    init: true
    ports:
      - "${DEEPDOC_RUNTIME_PORT:-18010}:8010"
    environment:
      DEEPDOC_SOURCE_DIR: /opt/deepdoc_source
      DEEPDOC_RESOURCE_ROOT: /opt/runtime_resources
      DEEPDOC_MODEL_DIR: /opt/runtime_resources/rag/res/deepdoc
      DEEPDOC_ENGINE_FACTORY: deepdoc_runtime.engine:create_reference_engine
      DEEPDOC_MAX_FILE_BYTES: ${DEEPDOC_MAX_FILE_BYTES:-104857600}
      DEEPDOC_ZOOMIN: ${DEEPDOC_ZOOMIN:-3}
      DEEPDOC_MAX_PAGES: ${DEEPDOC_MAX_PAGES:-2000}
      RAG_PROJECT_BASE: /opt/runtime_resources
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: ${DEEPDOC_OMP_NUM_THREADS:-2}
    volumes:
      - ./data/deepdoc_runtime/source:/opt/deepdoc_source:ro
      - ./data/models/deepdoc-runtime-res:/opt/runtime_resources/rag/res:ro
    shm_size: "1gb"
    mem_limit: ${DEEPDOC_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8010/health/ready"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 120s

  api:
    image: 2-industrial-rag-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial-rag-api
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: industrial_docs_qwen_1024_v1
      QDRANT_COLLECTION_ALIAS: industrial_docs_active
      EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      EMBEDDING_PROVIDER: qwen
      QWEN_EMBEDDING_MODEL: text-embedding-v4
      QWEN_EMBEDDING_DIMENSION: "1024"
      QWEN_EMBEDDING_API_KEY: ${QWEN_EMBEDDING_API_KEY}
      QWEN_EMBEDDING_BASE_URL: ${QWEN_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
      EMBEDDING_INDEX_VERSION: qwen-1024-v1

      MULTIMODAL_ENABLED: ${MULTIMODAL_ENABLED:-false}
      MULTIMODAL_EMBEDDING_PROVIDER: ${MULTIMODAL_EMBEDDING_PROVIDER:-qwen}
      QWEN_MULTIMODAL_EMBEDDING_MODEL: ${QWEN_MULTIMODAL_EMBEDDING_MODEL:-qwen3-vl-embedding}
      QWEN_MULTIMODAL_EMBEDDING_DIMENSION: ${QWEN_MULTIMODAL_EMBEDDING_DIMENSION:-1024}
      QWEN_MULTIMODAL_EMBEDDING_API_KEY: ${QWEN_MULTIMODAL_EMBEDDING_API_KEY:-}
      QWEN_MULTIMODAL_EMBEDDING_BASE_URL: ${QWEN_MULTIMODAL_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding}
      MULTIMODAL_EMBEDDING_INDEX_VERSION: ${MULTIMODAL_EMBEDDING_INDEX_VERSION:-qwen3vl-1024-v1}
      QDRANT_MULTIMODAL_COLLECTION: ${QDRANT_MULTIMODAL_COLLECTION:-industrial_multimodal_qwen3vl_1024_v1}
      QDRANT_MULTIMODAL_COLLECTION_ALIAS: ${QDRANT_MULTIMODAL_COLLECTION_ALIAS:-industrial_multimodal_active}
      MULTIMODAL_DEGRADED_MODE: ${MULTIMODAL_DEGRADED_MODE:-text_only}
      DOTS_OCR_URL: ${DOTS_OCR_URL:-}
      DOTS_OCR_TIMEOUT_SECONDS: ${DOTS_OCR_TIMEOUT_SECONDS:-120}
      DOCUMENT_PARSER_BACKEND: ${DOCUMENT_PARSER_BACKEND:-auto}
      DOCUMENT_PARSER_FALLBACK: ${DOCUMENT_PARSER_FALLBACK:-native}
      DEEPDOC_ENABLED: ${DEEPDOC_ENABLED:-false}
      DEEPDOC_RUNTIME_FACTORY: ${DEEPDOC_RUNTIME_FACTORY:-}
      DEEPDOC_RUNTIME_URL: ${DEEPDOC_RUNTIME_URL:-http://deepdoc-runtime:8010}
      DEEPDOC_CONNECT_TIMEOUT_SECONDS: ${DEEPDOC_CONNECT_TIMEOUT_SECONDS:-5}
      DEEPDOC_READ_TIMEOUT_SECONDS: ${DEEPDOC_READ_TIMEOUT_SECONDS:-300}
      DEEPDOC_HEALTH_TIMEOUT_SECONDS: ${DEEPDOC_HEALTH_TIMEOUT_SECONDS:-2}
      DEEPDOC_MODEL_DIR: ${DEEPDOC_MODEL_DIR:-/app/data/models/deepdoc}
      DEEPDOC_REQUIRE_MODEL_FILES: ${DEEPDOC_REQUIRE_MODEL_FILES:-true}
      DEEPDOC_ZOOMIN: ${DEEPDOC_ZOOMIN:-3}
      DEEPDOC_MAX_PAGES: ${DEEPDOC_MAX_PAGES:-2000}

      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_INDEX_PREFIX: ${OPENSEARCH_INDEX_PREFIX:-industrial_docs}
      KEYWORD_SEARCH_BACKEND: opensearch
      KEYWORD_INDEX_VERSION: v1
      HYBRID_DEGRADED_MODE: vector_only
      RETRIEVAL_FUSION_STRATEGY: ${RETRIEVAL_FUSION_STRATEGY:-rrf}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      RETRIEVAL_VECTOR_WEIGHT: ${RETRIEVAL_VECTOR_WEIGHT:-0.65}
      RETRIEVAL_KEYWORD_WEIGHT: ${RETRIEVAL_KEYWORD_WEIGHT:-0.35}

      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}

      PROMPT_CATALOG_PATH: "${PROMPT_CATALOG_PATH:-prompts/catalog}"
      PROMPT_RELEASE_PATH: "${PROMPT_RELEASE_PATH:-prompts/releases/stable.yaml}"
      PROMPT_VALIDATE_ON_STARTUP: "${PROMPT_VALIDATE_ON_STARTUP:-true}"
      PROMPT_EXPOSE_VERSION_IN_RESPONSE: "${PROMPT_EXPOSE_VERSION_IN_RESPONSE:-true}"

      RAGAS_ENABLED: ${RAGAS_ENABLED:-false}
      RAGAS_VERSION: ${RAGAS_VERSION:-0.4.3}
      RAGAS_JUDGE_MODEL: ${RAGAS_JUDGE_MODEL:-qwen-plus}
      RAGAS_EMBEDDING_MODEL: ${RAGAS_EMBEDDING_MODEL:-text-embedding-v4}
      RAGAS_DATASET_PATH: ${RAGAS_DATASET_PATH:-data/eval/ragas_eval_questions.json}

      LAYERED_MEMORY_ENABLED: ${LAYERED_MEMORY_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-2}
      REDIS_READ_TIMEOUT_SECONDS: ${REDIS_READ_TIMEOUT_SECONDS:-2}
      MEMORY_REDIS_KEY_PREFIX: ${MEMORY_REDIS_KEY_PREFIX:-industrial_rag:memory}
      MEMORY_SHORT_TERM_TTL_SECONDS: ${MEMORY_SHORT_TERM_TTL_SECONDS:-86400}
      MEMORY_SHORT_TERM_MAX_MESSAGES: ${MEMORY_SHORT_TERM_MAX_MESSAGES:-20}
      MEMORY_SUMMARY_TRIGGER_MESSAGES: ${MEMORY_SUMMARY_TRIGGER_MESSAGES:-12}
      MEMORY_RECENT_LIMIT: ${MEMORY_RECENT_LIMIT:-6}
      MEMORY_LONG_TERM_LIMIT: ${MEMORY_LONG_TERM_LIMIT:-4}
      MEMORY_SEMANTIC_SCORE_THRESHOLD: ${MEMORY_SEMANTIC_SCORE_THRESHOLD:-0.45}
      MEMORY_KEYWORD_MIN_SCORE: ${MEMORY_KEYWORD_MIN_SCORE:-0}
      MEMORY_QDRANT_COLLECTION: ${MEMORY_QDRANT_COLLECTION:-industrial_memory_qwen_1024_v1}
      MEMORY_INDEX_VERSION: ${MEMORY_INDEX_VERSION:-v1}
      MEMORY_BACKGROUND_WORKERS: ${MEMORY_BACKGROUND_WORKERS:-2}
      MEMORY_BACKGROUND_MAX_PENDING: ${MEMORY_BACKGROUND_MAX_PENDING:-100}

      KNOWLEDGE_GRAPH_ENABLED: ${KNOWLEDGE_GRAPH_ENABLED:-false}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-rag_graph_password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_CONNECTION_TIMEOUT_SECONDS: ${NEO4J_CONNECTION_TIMEOUT_SECONDS:-5}
      NEO4J_MAX_CONNECTION_POOL_SIZE: ${NEO4J_MAX_CONNECTION_POOL_SIZE:-20}
      KNOWLEDGE_GRAPH_RESULT_LIMIT: ${KNOWLEDGE_GRAPH_RESULT_LIMIT:-5}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key_change_me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}

      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/${POSTGRES_DB:-industrial_rag}

      RERANKER_MODEL: BAAI/bge-reranker-base
      USE_RERANKER: "${USE_RERANKER:-false}"
      RERANKER_FAIL_OPEN: ${RERANKER_FAIL_OPEN:-true}
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  streamlit:
    image: 2-industrial-rag-api:latest
    container_name: industrial-rag-streamlit
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "30000:8501"
    environment:
      RAG_API_URL: http://api:8000/api/v1/graph-chat
    volumes:
      - ./data:/app/data
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0

  react-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: industrial-rag-react-web:0.6.0
    container_name: industrial-rag-react-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${REACT_WEB_PORT:-30080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  init-sql:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial-rag-init-sql
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/${POSTGRES_DB:-industrial_rag}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: industrial_docs
      EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      USE_RERANKER: "false"
    volumes:
      - ./data:/app/data
    command: python -m scripts.init_sql_data
    profiles:
      - tools

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial-rag-ingest
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      LEGACY_QDRANT_COLLECTION: industrial_docs
      EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/${POSTGRES_DB:-industrial_rag}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      USE_RERANKER: "false"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    command: python -m scripts.ingest_docs
    profiles:
      - tools

volumes:
  redis_data:
  neo4j_data:
  qdrant_data:
  postgres_data:
  opensearch_data:
  hf_cache:
